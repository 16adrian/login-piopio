<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Permite tildes, ñ y emojis -->
  <meta charset="UTF-8">
  <!-- CLAVE para el responsive: el ancho de la página = ancho del dispositivo -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PíoPío | Iniciar sesión</title>
  <!-- Enlazamos la hoja de estilos -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Contenedor principal: aquí aplicamos CSS GRID -->
  <main class="login">

    <!-- ===== PANEL IZQUIERDO: MARCA ===== -->
    <section class="login__brand brand">
      <div class="brand__chick">🐥</div>
      <h1 class="brand__name">PíoPío</h1>
      <p class="brand__slogan">Tu nido digital, siempre a salvo.</p>
    </section>

    <!-- ===== PANEL DERECHO: FORMULARIO ===== -->
    <section class="login__form-area">
      <form class="form" action="#" method="post">

        <!-- Logo pequeño: solo se ve en móvil -->
        <span class="form__mini-logo">🐥 PíoPío</span>

        <h2 class="form__title">¡Hola de nuevo! <span>🐣</span></h2>
        <p class="form__subtitle">Ingresa tus datos para entrar a tu cuenta.</p>

        <!-- Campo correo -->
        <label class="form__label" for="email">Correo</label>
        <div class="form__field">
          <span class="form__icon">✉️</span>
          <input class="form__input" type="email" id="email" name="email"
                 placeholder="Ingresa tu correo" required>
        </div>

        <!-- Campo contraseña -->
        <label class="form__label" for="password">Contraseña</label>
        <div class="form__field">
          <span class="form__icon">🔒</span>
          <input class="form__input" type="password" id="password" name="password"
                 placeholder="Ingresa tu contraseña" required>
          <span class="form__icon form__icon--right">👁️</span>
        </div>

        <a class="form__forgot" href="#">¿Olvidaste tu contraseña?</a>

        <button class="form__button" type="submit">Iniciar sesión</button>

        <p class="form__signup">¿No tienes cuenta? <a href="#">Regístrate</a></p>
      </form>
    </section>

  </main>

</body>
</html>
